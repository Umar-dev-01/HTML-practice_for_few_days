<!DOCTYPE html>
<html>
<head>
    <title>Nav Bar</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: Poppins;
        }

        .nav-bar{
            width: 100%;
            height: 64px;
            border-bottom: 1px solid #ccc;
            display: flex;
            justify-content: center;
            background-color: #FFFFFFCC;
        }

        .container{
            width: 1178px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-bar-compact{
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text{
            display: flex;
            flex-direction: column;
             gap: 2px; 
             justify-content: center;   
        }

        .logo-text p{
            font-size: 10px;
            color: #555;
             font-size: 8px;     
        margin: 0; 
        }

        img{
            height: 40px;
        }

       
        .container2{
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .nav-link{
            font-size: 16px;
            color: #4A5565;
            cursor: pointer;
        }

        .button{
            background-color: #0072BD;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

    </style>
</head>

<body>

<div class="nav-bar">

    <div class="container">

        <div class="nav-bar-compact">
           
            <img src="PS Logo Icon- Main.svg">

            <div class="logo-text">
                <img src="Solutions Panda Typography.svg" style="height: 18px;">
                <p>Solutions that will smile back at you</p>
            </div>

        </div>

       
        <div class="container2">
            <div class="nav-link">Services</div>
            <div class="nav-link">Why Us</div>
            <div class="nav-link">Contact</div>
            <div class="button">Get Started</div>
        </div>

    </div>

</div>

</body>
</html>
